<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>细节一：召回与压缩交汇</title><style>body{margin:0;padding:32px;background:#f5f5f5;color:#2d3142;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.page{max-width:1280px;margin:auto}.tag,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.tag{font-size:12px;letter-spacing:.16em;color:#4f5d75}h1{font-family:Georgia,"Songti SC",serif;font-size:40px;font-weight:400;margin:8px 0}.sub{color:#4f5d75;margin:0 0 24px}svg{width:100%;display:block}.note{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:20px}.card{background:#fff;border:1px solid rgba(45,49,66,.12);border-radius:6px;padding:20px}.card:first-child{border-top:3px solid #eb6c36}.card h2{font-size:16px;margin:0 0 8px}.card p{font-size:13px;line-height:1.6;color:#4f5d75;margin:0}</style></head><body><main class="page"><div class="tag">DETAIL 01 · BEFORE_PROMPT_BUILD</div><h1>同一钩子中的先读后写</h1><p class="sub">持久层先恢复跨轮记忆，压缩层再整理本轮上下文；干净 prompt 缓存隔离了 recall 注入与后续 capture。</p><svg viewBox="0 0 1280 720" role="img" aria-labelledby="d1t d1d" xmlns="http://www.w3.org/2000/svg"><title id="d1t">召回与压缩交汇细节</title><desc id="d1d">展示 before prompt build 中缓存干净 prompt、并行召回、上下文注入、异步摘要、L3 压缩与 MMD 注入。</desc><defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="ao" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><g stroke="rgba(45,49,66,.2)" stroke-dasharray="3,3"><line x1="120" y1="112" x2="120" y2="640"/><line x1="400" y1="112" x2="400" y2="640"/><line x1="720" y1="112" x2="720" y2="640"/><line x1="1000" y1="112" x2="1000" y2="640"/></g><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><g><rect x="40" y="48" width="160" height="64" rx="6" fill="rgba(79,93,117,.1)" stroke="#7a8399"/><text x="120" y="84" font-size="16" font-weight="600">会话运行时</text><text x="120" y="104" font-size="12" fill="#4f5d75">本轮 prompt</text></g><g><rect x="304" y="48" width="192" height="64" rx="6" fill="#fff" stroke="#2d3142"/><text x="400" y="84" font-size="16" font-weight="600">记忆插件</text><text x="400" y="104" font-size="12" fill="#4f5d75">持久层 · read</text></g><g><rect x="624" y="48" width="192" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text x="720" y="84" font-size="16" font-weight="600">Offload 插件</text><text x="720" y="104" font-size="12" fill="#4f5d75">压缩层 · write</text></g><g><rect x="904" y="48" width="192" height="64" rx="6" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.3)" stroke-dasharray="4,3"/><text x="1000" y="84" font-size="16" font-weight="600">异步任务</text><text x="1000" y="104" font-size="12" fill="#4f5d75">L1 / L1.5</text></g></g><g fill="rgba(45,49,66,.06)" stroke="#4f5d75"><rect x="396" y="152" width="8" height="208"/><rect x="716" y="392" width="8" height="192"/><rect x="996" y="424" width="8" height="96"/></g><g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"><line x1="120" y1="152" x2="396" y2="152"/><path d="M404 192 H452 Q460 192 460 200 V216 Q460 224 452 224 H404"/><path d="M404 264 H452 Q460 264 460 272 V288 Q460 296 452 296 H404"/><line x1="396" y1="344" x2="120" y2="344" stroke-dasharray="5,4"/><line x1="120" y1="392" x2="716" y2="392" stroke="#eb6c36" marker-end="url(#aa)"/><line x1="724" y1="424" x2="1000" y2="424" stroke-dasharray="5,4" marker-end="url(#ao)"/><line x1="724" y1="472" x2="1000" y2="472" stroke-dasharray="5,4" marker-end="url(#ao)"/><path d="M724 520 H772 Q780 520 780 528 V544 Q780 552 772 552 H724"/><line x1="716" y1="584" x2="120" y2="584" stroke="#eb6c36" marker-end="url(#aa)"/></g><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4f5d75"><text x="188" y="140">① BEFORE_PROMPT_BUILD</text><text x="468" y="208">缓存干净 prompt</text><text x="468" y="280">并行搜索 L0 / L1 / L2 / L3</text><text x="180" y="332">PREPEND + APPEND CONTEXT</text><text x="336" y="380" fill="#eb6c36">② SAME HOOK · COMPRESS</text><text x="804" y="412">FLUSH L1</text><text x="804" y="460">L1.5 TASK JUDGE</text><text x="788" y="536">FAST-PATH + L3</text><text x="332" y="572" fill="#eb6c36">活跃 MMD + 压缩后消息列表</text></g><g><rect x="312" y="620" width="656" height="52" rx="4" fill="rgba(235,108,54,.06)" stroke="rgba(235,108,54,.45)" stroke-dasharray="4,4"/><text x="640" y="644" text-anchor="middle" font-size="14" font-style="italic" font-family="Georgia,'Songti SC',serif" fill="#2d3142">交汇规则：持久层负责“取回什么”，压缩层负责“本轮带多少”。</text><text x="640" y="664" text-anchor="middle" font-size="12" fill="#4f5d75">缓存的干净 prompt 将在 agent_end 捕获时替换被 recall 污染的消息</text></g></svg><section class="note"><article class="card"><h2>为什么必须先召回再压缩</h2><p>如果顺序相反，压缩层无法评估新注入记忆带来的真实 Token 压力，也无法统一整理最终消息列表。</p></article><article class="card"><h2>异步不等于无影响</h2><p>L1 与 L1.5 请求异步发出；当前可用结果通过 fast-path 重应用，L3 与 MMD 则在本轮调用前同步落到上下文。</p></article></section></main></body></html>
