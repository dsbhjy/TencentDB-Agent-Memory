<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>细节二：工具循环与捕获</title><style>body{margin:0;padding:32px;background:#f5f5f5;color:#2d3142;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.page{max-width:1280px;margin:auto}.tag{font:12px ui-monospace,monospace;letter-spacing:.16em;color:#4f5d75}h1{font:400 40px Georgia,"Songti SC",serif;margin:8px 0}.sub{color:#4f5d75;margin:0 0 24px}svg{display:block;width:100%}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.card{background:#fff;border:1px solid rgba(45,49,66,.12);border-radius:6px;padding:20px}.card:last-child{border-top:3px solid #eb6c36}.card h2{font-size:16px;margin:0 0 8px}.card p{font-size:13px;line-height:1.6;color:#4f5d75;margin:0}</style></head><body><main class="page"><div class="tag">DETAIL 02 · TOOL LOOP & CAPTURE</div><h1>本轮工具结果如何变成跨轮记忆</h1><p class="sub">工具对先进入压缩层 pending 队列；回合结束后，持久层再用干净 prompt 完成 L0 原子捕获。</p><svg viewBox="0 0 1280 720" role="img" aria-labelledby="d2t d2d" xmlns="http://www.w3.org/2000/svg"><title id="d2t">工具循环与捕获细节</title><desc id="d2d">展示 Token 快照、工具调用循环、pending 阈值触发摘要、MMD 增量更新以及 agent end 原子捕获。</desc><defs><marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="ba" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="bo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><g stroke="rgba(45,49,66,.2)" stroke-dasharray="3,3"><line x1="120" y1="112" x2="120" y2="640"/><line x1="400" y1="112" x2="400" y2="640"/><line x1="720" y1="112" x2="720" y2="640"/><line x1="1000" y1="112" x2="1000" y2="640"/></g><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle"><g><rect x="40" y="48" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/><text x="120" y="84" font-size="16" font-weight="600">LLM / Agent</text><text x="120" y="104" font-size="12" fill="#4f5d75">推理循环</text></g><g><rect x="304" y="48" width="192" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text x="400" y="84" font-size="16" font-weight="600">Offload 插件</text><text x="400" y="104" font-size="12" fill="#4f5d75">pending + MMD</text></g><g><rect x="624" y="48" width="192" height="64" rx="6" fill="rgba(79,93,117,.1)" stroke="#7a8399"/><text x="720" y="84" font-size="16" font-weight="600">工具运行时</text><text x="720" y="104" font-size="12" fill="#4f5d75">参数与结果</text></g><g><rect x="904" y="48" width="192" height="64" rx="6" fill="#fff" stroke="#2d3142"/><text x="1000" y="84" font-size="16" font-weight="600">记忆插件</text><text x="1000" y="104" font-size="12" fill="#4f5d75">L0 capture</text></g></g><g fill="rgba(45,49,66,.06)" stroke="#4f5d75"><rect x="116" y="152" width="8" height="440"/><rect x="396" y="184" width="8" height="408"/><rect x="716" y="248" width="8" height="128"/><rect x="996" y="592" width="8" height="64"/></g><g><rect x="72" y="208" width="696" height="216" rx="4" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.22)"/><rect x="72" y="208" width="52" height="20" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,.22)"/><text x="98" y="222" font-size="8" font-family="ui-monospace,monospace" text-anchor="middle" fill="#4f5d75">LOOP</text><text x="132" y="222" font-size="8" font-family="ui-monospace,monospace" fill="#4f5d75">[每次工具调用]</text></g><g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#b)"><line x1="120" y1="152" x2="396" y2="152"/><line x1="120" y1="248" x2="396" y2="248"/><line x1="404" y1="280" x2="716" y2="280"/><line x1="716" y1="328" x2="120" y2="328" stroke-dasharray="5,4"/><line x1="120" y1="376" x2="396" y2="376"/><path d="M404 448 H452 Q460 448 460 456 V472 Q460 480 452 480 H404"/><path d="M404 504 H452 Q460 504 460 512 V528 Q460 536 452 536 H404"/><line x1="404" y1="560" x2="720" y2="560" stroke-dasharray="5,4" marker-end="url(#bo)"/><line x1="120" y1="592" x2="996" y2="592" stroke="#eb6c36" marker-end="url(#ba)"/><path d="M1004 616 H1052 Q1060 616 1060 624 V640 Q1060 648 1052 648 H1004"/></g><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4f5d75"><text x="188" y="140">③ LLM_INPUT · TOKEN SNAPSHOT</text><text x="188" y="236">BEFORE_TOOL_CALL</text><text x="500" y="268">缓存工具参数</text><text x="460" y="316">执行结果</text><text x="188" y="364">AFTER_TOOL_CALL</text><text x="468" y="464">pending 工具对入库</text><text x="468" y="520">MMD 增量更新</text><text x="492" y="548">pending ≥ 4 · FORCE FLUSH L1</text><text x="468" y="580" fill="#eb6c36">⑤ AGENT_END · 干净 prompt + 对话结果</text><text x="1068" y="632">原子写 L0</text></g><g><rect x="296" y="664" width="688" height="40" rx="4" fill="rgba(235,108,54,.06)" stroke="rgba(235,108,54,.45)" stroke-dasharray="4,4"/><text x="640" y="688" text-anchor="middle" font-size="14" font-style="italic" font-family="Georgia,'Songti SC',serif">压缩层保住本轮可用性；持久层在回合结束后保住跨轮连续性。</text></g></svg><section class="cards"><article class="card"><h2>pending 阈值是即时减压阀</h2><p>每个工具参数与结果形成一对 pending 记录；累计到默认阈值 4 时，不等回合结束，立即异步触发 L1 摘要。</p></article><article class="card"><h2>捕获必须使用干净输入</h2><p>agent_end 不直接保存被 recall 注入污染的用户消息，而是换回开头缓存的 prompt，避免“注入→捕获→再注入”。</p></article></section></main></body></html>
